name: MP_PREVIEW

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: mp-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: 校验 PR 发起者
        id: check-author
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const allowedUsers = ['novlan1', 'yao'];
            const allowed = allowedUsers.includes(author);
            core.info(`PR author: ${author}, allowed: ${allowed}`);
            core.setOutput('allowed', String(allowed));
            core.setOutput('author', author);

      - name: 跳过非白名单用户
        if: steps.check-author.outputs.allowed != 'true'
        run: echo "⏭️ 用户 ${{ steps.check-author.outputs.author }} 不在白名单中，跳过预览构建"

      - uses: actions/checkout@v6
        if: steps.check-author.outputs.allowed == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 查找或创建评论
        if: steps.check-author.outputs.allowed == 'true'
        id: bot-comment
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- mp-preview-bot -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${MARKER}\n⏳ 正在构建小程序预览版本，请稍候...\n\n🔗 [查看构建日志](${runUrl})`;

            // 查找已有的机器人评论
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            let commentId;
            if (existing) {
              // 复用已有评论
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              commentId = existing.id;
              core.info(`♻️ 复用已有评论 #${commentId}`);
            } else {
              // 创建新评论
              const { data: comment } = await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              commentId = comment.id;
              core.info(`✨ 创建新评论 #${commentId}`);
            }
            core.setOutput('comment-id', commentId);

      - uses: pnpm/action-setup@v4
        if: steps.check-author.outputs.allowed == 'true'

      - uses: actions/setup-node@v6
        if: steps.check-author.outputs.allowed == 'true'
        with:
          node-version-file: .node-version

      - name: 安装依赖
        if: steps.check-author.outputs.allowed == 'true'
        run: pnpm install

      - name: 构建小程序
        if: steps.check-author.outputs.allowed == 'true'
        run: pnpm run build:mp

      - name: 清理依赖 & 安装 miniprogram-ci
        if: steps.check-author.outputs.allowed == 'true'
        run: |
          rm -rf node_modules
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            delete pkg.dependencies;
            delete pkg.devDependencies;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm install miniprogram-ci dotenv

      - name: 上传预览
        if: steps.check-author.outputs.allowed == 'true'
        id: mp-preview
        env:
          MINI_APP_ID: ${{ secrets.TDESIGN_UNI_APP_ID }}
          MINI_APP_PRIVATE_KEY: ${{ secrets.TDESIGN_UNI_MINI_KEY }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: node script/mp-preview.mjs

      - name: 上传二维码到腾讯云 COS
        if: steps.check-author.outputs.allowed == 'true'
        uses: sylingd/tencent-cos-and-cdn-action@v1
        id: cos
        with:
          secret_id: ${{ secrets.TENCENT_COS_SECRET_ID }}
          secret_key: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          cos_bucket: mike-1255355338
          cos_region: ap-guangzhou
          local_path: wx-mp-preview-qrcode.png
          cdn_type: cdn
          cdn_prefix: 'https://cdn.uwayfly.com/'
          cdn_wait_flush: true
          remote_path: tdesign-uniapp-starter/wx-mp-preview-qrcode.png

      - name: 评论 PR（预览二维码）
        if: steps.check-author.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const author = '${{ steps.check-author.outputs.author }}';
            const sha = '${{ github.event.pull_request.head.sha }}'.slice(0, 7);
            const cosUrl = '${{ steps.cos.outputs.url }}';
            const version = `${{ steps.mp-preview.outputs.version }}`;
            const robot = '${{ steps.mp-preview.outputs.robot }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const MARKER = '<!-- mp-preview-bot -->';
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.bot-comment.outputs.comment-id }},
              body: [
                MARKER,
                `### 📱 小程序预览`,
                ``,
                `<img alt="小程序预览二维码" src="${cosUrl}" width="280" />`,
                ``,
                `| 信息 | 详情 |`,
                `|------|------|`,
                `| **版本** | \`${version}\` |`,
                `| **机器人** | #${robot} |`,
                `| **提交** | \`${sha}\` |`,
                `| **构建者** | @${author} |`,
                `| **CI** | [查看日志](${runUrl}) |`,
              ].join('\n')
            });

      - name: 评论 PR（构建失败）
        if: failure() && steps.check-author.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- mp-preview-bot -->';
            const commentId = '${{ steps.bot-comment.outputs.comment-id }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: Number(commentId),
                body: `${MARKER}\n### ❌ 小程序预览构建失败\n\n🔗 [查看构建日志](${runUrl})`
              });
            }
