name: Update @tdesign/uniapp

on:
  # 外部 webhook 触发（由 tdesign-miniprogram 仓库的 GitHub webhook 发送）
  repository_dispatch:
    types: [tdesign-miniprogram-pr]

  # 手动触发，输入 PR 号
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'tdesign-miniprogram 的 PR 号'
        required: true
        type: string

concurrency:
  group: update-tdesign-${{ github.event.client_payload.pr_number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  update-dep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: 获取 PR 号
        id: get-pr
        run: |
          PR_NUMBER="${{ github.event.inputs.pr_number || github.event.client_payload.pr_number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "❌ 未提供 PR 号"
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          PR_TITLE="${{ github.event.client_payload.pr_title }}"
          echo "pr_title=$PR_TITLE" >> "$GITHUB_OUTPUT"

          PR_URL="${{ github.event.client_payload.pr_url }}"
          if [ -z "$PR_URL" ]; then
            PR_URL="https://github.com/Tencent/tdesign-miniprogram/pull/$PR_NUMBER"
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

          echo "📌 tdesign-miniprogram PR #$PR_NUMBER"
          echo "   标题: $PR_TITLE"
          echo "   链接: $PR_URL"

      - name: 更新 @tdesign/uniapp
        id: update-dep
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"
          NEW_URL="https://pkg.pr.new/@tdesign/uniapp@${PR_NUMBER}"

          echo "📦 安装 @tdesign/uniapp from PR #${PR_NUMBER}"
          echo "   URL: $NEW_URL"

          # 更新 package.json 中的 @tdesign/uniapp 版本
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const oldVersion = pkg.dependencies['@tdesign/uniapp'];
            pkg.dependencies['@tdesign/uniapp'] = '${NEW_URL}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Old version:', oldVersion);
            console.log('New version:', '${NEW_URL}');
          "

          # 安装依赖，更新 lockfile
          pnpm store prune 2>/dev/null || true
          pnpm install --no-frozen-lockfile

          echo "new_url=$NEW_URL" >> "$GITHUB_OUTPUT"

      - name: 检查是否有变更
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "✅ 无变更，版本已是最新"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "📝 检测到变更"
          fi

      - name: 提交并创建 PR
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
        with:
          script: |
            const { execSync } = require('child_process');
            const prNumber = process.env.PR_NUMBER;
            const branchName = `chore/update-tdesign-uniapp-pr-${prNumber}`;

            // 配置 git
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');

            // 创建分支并提交
            try {
              execSync(`git checkout -b ${branchName}`);
            } catch {
              execSync(`git checkout ${branchName}`);
            }

            execSync('git add package.json pnpm-lock.yaml');
            execSync(`git commit -m "chore: update @tdesign/uniapp to PR #${prNumber}"`);
            execSync(`git push -f origin ${branchName}`);

            // 查找已有的 PR
            const { data: existingPRs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branchName}`,
              state: 'open',
            });

            const prTitle = '${{ steps.get-pr.outputs.pr_title }}' || '';
            const prUrl = '${{ steps.get-pr.outputs.pr_url }}';
            const title = prTitle
              ? `chore: update @tdesign/uniapp to PR #${prNumber} - ${prTitle}`
              : `chore: update @tdesign/uniapp to PR #${prNumber}`;
            const body = [
              `自动更新 \`@tdesign/uniapp\` 依赖版本。`,
              ``,
              `- 来源: [tdesign-miniprogram PR #${prNumber}](${prUrl})`,
              `- 包地址: \`https://pkg.pr.new/@tdesign/uniapp@${prNumber}\``,
            ].join('\n');

            if (existingPRs.length > 0) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: existingPRs[0].number,
                title,
                body,
              });
              core.info(`♻️ 已更新现有 PR #${existingPRs[0].number}`);
            } else {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                head: branchName,
                base: 'develop',
              });
              core.info(`✅ 创建 PR #${pr.number}`);
            }
